[project]
name = "turkish-ice-cream"
version = "0.1.0"
description = ""
authors = [{ name = "AaronWu-train", email = "aaronwu0218@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "RPi.GPIO",
]

[tool.poetry]
packages = [
    { include = "core" },
    { include = "hand_tracking", from = "packages" },
    { include = "motor_control", from = "packages" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
