[project]
name = "turkish-ice-cream"
version = "0.1.0"
description = ""
authors = [{ name = "AaronWu-train", email = "aaronwu0218@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "uvicorn[standard]>=0.32",
    "RPi.GPIO; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "python-dotenv (>=1.2.2,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "core" },
    { include = "vision_service" },
    { include = "hand_tracking", from = "packages" },
    { include = "motor_control", from = "packages" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
